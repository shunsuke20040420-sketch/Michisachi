<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="robots" content="noindex" />
    <title>Netlify Forms</title>
  </head>
  <body>
    <form name="contact" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="contact" />
      <input name="bot-field" />
      <input name="name" />
      <input type="email" name="email" />
      <select name="type">
        <option value="waitlist">先行登録</option>
        <option value="pro">Pro先行登録</option>
        <option value="feedback">フィードバック</option>
        <option value="test">利用テスト希望</option>
      </select>
      <textarea name="message"></textarea>
      <input type="text" name="consent" />
      <input type="text" name="createdAt" />
    </form>
  </body>
</html>
